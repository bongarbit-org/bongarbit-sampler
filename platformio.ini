; PlatformIO Project Configuration File
;
; Hardware: ESP32-S3 N16R8 (16MB Quad flash + 8MB Octal PSRAM)
;         + PCM5102A I2S DAC breakout
;         + microSD card reader (SPI)
;
; See shared/docs/circuit.md for the full wiring plan and pin justification.
;
; Two instruments live in this repository, one folder each, on top of a third
; folder they both compile (README.md has the map). One environment per
; sketch, grouped below by the folder it belongs to:
;   sampler/  sampler (default)  the sampler firmware
;             sd_test            SD card diagnostic, Arduino's own SD.h
;   agbau/    agbau              the Agbau firmware
;             agbau_storage      the Agbau storage spike
;   shared/   i2s_bench          I2S transport bench, no M16
;   test/     native             host unit suite, nothing for the board
;
; Build/upload a specific one with: pio run -e agbau -t upload
;
; src_dir is the repository root, so each environment can name its own
; folder. That makes build_src_filter mandatory: every environment lists the
; one sketch it builds, and the default filter would compile the whole repo.
; It also means a new sketch needs only its own environment. This file used
; to share one src/ and exclude every other sketch from every environment, so
; each new sketch was an edit to all the others.
;
; The ESP32 settings live in [esp32_base] rather than [env] on purpose. [env]
; is inherited by EVERY environment, including native, which would then try to
; resolve an Xtensa toolchain to compile desktop tests.

[platformio]
default_envs = sampler
src_dir = ${PROJECT_DIR}

[esp32_base]
; M16 uses the new i2s_std driver, which needs Arduino core 3.x (ESP-IDF 5).
; The official PlatformIO "espressif32" platform does not provide it and is not
; going to: even the current 7.0.1 still pins framework-arduinoespressif32
; 3.20017 (= core 2.0.17), and the build fails with
;   M16.h: fatal error: driver/i2s_std.h: No such file or directory
; pioarduino is the community fork that tracks core 3.x. Pinned to an exact
; release rather than a range, because the toolchain is the one dependency
; whose silent drift would be hardest to debug from the audio symptoms.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
; --- N16R8 memory configuration ---
; This is the N16R8 variant: 16MB Quad-SPI flash + 8MB Octal-SPI PSRAM. The
; generic "esp32-s3-devkitc-1" board is the N8 (8MB flash, NO PSRAM), so it
; used to be corrected here with a stack of board_build/board_upload
; overrides. Those did work - BOARD_HAS_PSRAM was defined and the 16MB
; partition table was applied - but they left board_upload.maximum_size at the
; N8's 8MB, so PlatformIO checked the firmware size against the wrong ceiling
; while writing a partition table that runs to 0xff0000.
;
; This platform ships a board definition for exactly this variant, which sets
; partitions, memory_type=qio_opi, psram_type=opi, BOARD_HAS_PSRAM and the
; correct 16MB size limits, coherently and in one place.
board = esp32-s3-devkitc1-n16r8
framework = arduino

build_flags =
    ; Without this flag Serial defaults to UART0 (GPIO 43/44) and the monitor
    ; stays empty even though the firmware is running fine.
    ;
    ; This comment used to claim the board "exposes only the native USB port
    ; (no separate CP2102/CH340 UART bridge chip)". That is FALSE for this
    ; board: it has two USB connectors, the native one (GPIO 19/20) and a WCH
    ; bridge (USB id 1a86:55d3) silkscreened COM. The flag is still correct -
    ; Serial goes out the NATIVE port - but the reason given was wrong, and it
    ; cost a serial capture that came back empty because the cable was in COM.
    ;
    ; Which connector is used is not cosmetic: as of 11/10/2026 audio is
    ; reliable powered through COM and unreliable through the native port.
    ; Unexplained, under investigation - see shared/docs/bancada.md section
    ; 11. Any by-ear result has to record which port the board was on.
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; The generic devkitc-1 board carried this in its extra_flags; the n16r8
    ; board definition does not, so it has to be stated explicitly or the USB
    ; CDC flag above has nothing to attach to and serial goes quiet again.
    -DARDUINO_USB_MODE=1
    ; The engine every firmware here compiles. An instrument's own headers sit
    ; next to its main.cpp and are found without a flag.
    -I shared/src

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; M16 is pinned to an exact commit, for the same reason `platform` above is.
;
; It was unpinned until 11/10/2026, and that is not a hypothetical risk: the
; library rewrote its output transport while this project was being built on
; top of it. `i2s_write_samples()` used to issue one i2s_channel_write() per
; frame; it is now a [[deprecated]] shim over audioBlockWrite(), which
; accumulates M16_BLOCK_SIZE (32) frames and issues one DMA write per block.
; Same call, same audible result, ~19% of one core's time difference - the
; exact quantity shared/docs/bancada.md section 9 was measuring. The same
; update also added a dual-core block-split mode in which the deprecated shim
; returns false and writes NOTHING, reachable by one default flipping upstream
; (setIsDualCore, currently false on ESP32).
;
; A floating dependency that can silently change the audio transport makes
; every bench number and every "validated on hardware" note in the docs
; expire without notice. Pinned, a hardware result stays attached to
; something.
;
; CAVEAT: this pin is NOT the commit the 13-14/08/2026 bench ran against. That
; checkout was destroyed and re-cloned on 10/10/2026, and its commit is
; unrecoverable (the clone has a single reflog entry). So the DMA ladder and
; the four-voice result in shared/docs/bancada.md needed re-confirming against
; THIS version. The ring was, on 11/10/2026, by the agbau_storage voice ladder
; (section 13).
;
; Every environment that uses M16 takes this list rather than restating it, so
; the pin stays one line: a second copy is a second thing to forget when it
; moves. It lives in its own section, not in either instrument's, because
; both depend on it equally.
[m16]
lib_deps =
    https://github.com/algomusic/M16.git#aef89b23ae449aa3c573833b61032a4ee134de33
    greiman/SdFat @ ^2.3.0

; --- The sampler (sampler/) ------------------------------------------------

[env:sampler]
extends = esp32_base
build_src_filter = +<sampler/src/>
lib_deps = ${m16.lib_deps}

; Standalone SD card diagnostic (uses the Arduino core's own SD.h, not
; SdFat/M16 - useful to rule out a library-specific issue when debugging SD
; hardware in isolation).
[env:sd_test]
extends = esp32_base
build_src_filter = +<sampler/bench/sd_test.cpp>

; --- The Agbau (agbau/, plan in agbau/docs/migration.md) -------------------
; Another instrument on the same board. Both of its environments share this
; base: the kit lives in a flash partition, so they carry their own partition
; table - the sampler keeps the board default.
[agbau_base]
extends = esp32_base
board_build.partitions = agbau/partitions.csv
; PlatformIO finds the size ceiling of the default table's app0, but not of a
; "factory" partition: without this it checks the firmware against the whole
; 16MB chip, which is the wrong-ceiling problem the board definition was
; adopted to fix. 0x300000 = the factory row of agbau/partitions.csv.
board_upload.maximum_size = 3145728
; Serial on UART0, i.e. out of the COM connector (WCH bridge), not the native
; one. Audio is only reliable with the board on COM (shared/docs/bancada.md,
; section 11), and the log has to come down the same cable as the power. The
; sampler keeps CDC-on-boot.
;
; agbau/src is on the path for the storage spike, which sits in agbau/bench
; and maps the kit with the firmware's own headers.
build_unflags = -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
    ${esp32_base.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=0
    -I agbau/src
lib_deps = ${m16.lib_deps}

; The Agbau firmware. Its kit image goes into the "samples" partition once,
; with esptool (see the top of agbau/src/main.cpp); uploading the firmware
; leaves it alone.
[env:agbau]
extends = agbau_base
build_src_filter = +<agbau/src/>

; Agbau storage spike (agbau/docs/migration.md, step 0): measures the kit
; mapped from a flash partition against the kit loaded from SD into PSRAM, then
; a ladder of 1 to 64 voices to listen to. Results in shared/docs/bancada.md,
; section 13. Preparing the kit image and the SD card is described at the top
; of the sketch.
[env:agbau_storage]
extends = agbau_base
build_src_filter = +<agbau/bench/agbau_storage.cpp>

; --- Shared by both (shared/) ----------------------------------------------

; Standalone I2S tone generator - no M16, no SdFat. Isolates "can this DAC make
; sound at all" from anything either firmware or M16 might be doing wrong, the
; same way sd_test isolates the card from SdFat.
[env:i2s_bench]
extends = esp32_base
build_src_filter = +<shared/bench/i2s_bench.cpp>

; --- Host-side unit tests: pio test -e native ---------------------------
; Compiles test/ plus the header-only model in shared/sim, with the desktop
; toolchain. No sketch is built (test_build_src defaults off), so no ESP32
; headers are involved and this runs anywhere g++ does.
;
; The suites are grouped like the folders they test: test/shared,
; test/sampler, test/agbau. One instrument alone: -f 'agbau/*'. PlatformIO
; puts a nested suite's parent folder on its include path, which is how the
; Agbau's suites reach test/agbau/bela_reference.h and nothing else does.
;
; Always pass -e native. A bare "pio test" would also target the ESP32
; environments, which means trying to upload to a board.
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -I shared/src
    -I shared/sim
    -I sampler/src
    -I agbau/src
    ; Unity compiles its double assertions out unless told otherwise, and
    ; silently FAILS them with "Double Precision Disabled" rather than skipping.
    -DUNITY_INCLUDE_DOUBLE
    -DUNITY_DOUBLE_PRECISION=1e-12
    ; test_voice runs the note queue across two real threads, as the board
    ; runs it across two cores. Recent glibc links std::thread without this;
    ; older ones and other hosts do not.
    -pthread
